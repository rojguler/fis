name: ikas_fis
description: Food Information System for IKAS Cafeteria
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.2
  firebase_auth: ^5.5.2
  
  # UI & State Management
  provider: ^6.1.1
  
  # Typography
  google_fonts: ^6.2.1

  # Image Caching
  cached_network_image: ^3.3.1
  
  # Notifications
  firebase_messaging: ^15.2.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  image_picker: ^1.2.1
  firebase_storage: ^12.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_sign_in: ^7.2.0
  lottie: ^3.3.3
  confetti: ^0.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
